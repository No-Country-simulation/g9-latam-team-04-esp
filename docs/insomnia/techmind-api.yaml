    method: POST
    body:
      mimeType: application/json
      text: >
        {
          "items": [
            {
              "titulo": "Express.js: El marco web estándar para Node.js",
              "texto": "Si bien Node.js proporciona el entorno de ejecución, construir una aplicación web o una API RESTful desde cero solo con los módulos nativos de Node.js puede ser tedioso y propenso a errores. Aquí es donde entra en juego Express.js. Express.js es un framework web minimalista y flexible para Node.js que proporciona un conjunto robusto de características para construir aplicaciones web y API de manera rápida y eficiente. Se ha convertido en el estándar de facto para el desarrollo de backend con Node.js, siendo el componente 'E' en la popular pila MEAN/MERN/MEVN (MongoDB, Express, Angular/React/Vue, Node.js)."
            },
        		{
              "titulo":"NPM: El ecosistema de módulos más grande del mundo",
              "texto": "La filosofía de NPM se centra en la modularidad. Un 'paquete' o 'módulo' en NPM es un directorio con uno o varios programas escritos en JavaScript, junto con un archivo package.json que describe el módulo y sus dependencias. Cuando instalas un paquete, NPM se encarga de descargar no solo ese paquete, sino también todas sus dependencias, asegurando que todo lo necesario para que el módulo funcione esté disponible en tu proyecto."
            }
          ]
        }
    headers:
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
