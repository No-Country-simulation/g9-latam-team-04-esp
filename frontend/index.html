<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMind — El cerebro que entiende tu contenido técnico</title>
  <meta name="description" content="TechMind clasifica, organiza y reutiliza contenido técnico con modelos de IA.">
  <!-- Favicon en formato PNG -->
  <link rel="icon" type="image/png" href="assets/logos/techmind-icon.png">

  <!-- Tema temprano: evita flash, arranca en dark (mundo Volt) salvo preferencia guardada -->
  <script src="js/tema-temprano.js"></script>

  <!-- Preloads: la splash (4-5s) da tiempo; esto baja los assets en paralelo al primer render -->
  <link rel="preload" as="image" href="assets/logos/techmind.png">
  <link rel="preload" as="image" href="assets/logos/techmind-icon.png">
  <link rel="preload" as="fetch" href="assets/data/team.json" crossorigin="anonymous">
  <link rel="preload" as="script" href="vendor/chart.umd.js">

  <!-- Tipografía: Onest (display + UI del mundo Volt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (sin build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Onest", "ui-sans-serif", "system-ui", "sans-serif"] },
          colors: {
            void:   "rgb(var(--c-void) / <alpha-value>)",
            coal:   "rgb(var(--c-coal) / <alpha-value>)",
            ash:    "rgb(var(--c-ash) / <alpha-value>)",
            dot:    "rgb(var(--c-dot) / <alpha-value>)",
            paper:  "rgb(var(--c-paper) / <alpha-value>)",
            muted:  "rgb(var(--c-muted) / <alpha-value>)",
            volt:   "rgb(var(--c-volt) / <alpha-value>)",
            ok:     "rgb(var(--c-ok) / <alpha-value>)",
            warn:   "rgb(var(--c-warn) / <alpha-value>)",
            err:    "rgb(var(--c-err) / <alpha-value>)",
          },
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/app.css">
  <script src="env-config.js"></script>
</head>
<body class="bg-void text-paper font-sans antialiased">

  <!-- ============ SPLASH (modal bajo demanda) ============ -->
  <div id="splash" role="dialog" aria-modal="true" aria-label="Presentación TechMind"
       class="fixed inset-0 z-50 hidden flex flex-col items-center justify-between overflow-hidden bg-void">
    <div class="splash-dotgrid pointer-events-none absolute inset-0" aria-hidden="true"></div>

    <!-- Cerrar (X) -->
    <button type="button" id="splash-close" data-splash-close
      class="absolute right-4 top-4 z-10 grid h-9 w-9 place-items-center rounded-[8px] text-muted transition-colors duration-200 hover:bg-dot hover:text-paper"
      aria-label="Cerrar presentación" title="Cerrar (Esc)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="relative flex w-full max-w-5xl flex-1 flex-col items-center justify-center px-6 pt-3">
      <div class="splash-brand flex flex-col items-center justify-center">
        <img 
          src="assets/logos/techmind.png" 
          alt="TechMind" 
          class="logo-invert h-auto w-48 lg:w-64 max-w-full object-contain drop-shadow-[0_0_18px_rgba(229,255,143,0.18)]" 
          width="420" 
          height="150"
        >
      </div>
      <p class="mt-2 text-[12px] lg:text-[18px] font-medium tracking-[0.5px] text-muted">El cerebro que entiende tu contenido técnico. La API, lo comparte!</p>

      <div class="mt-12 lg:mt-20 w-full">
        <ul id="splash-team" class="grid grid-cols-2 gap-4 gap-y-6 sm:grid-cols-4 md:gap-5" aria-label="Equipo TechMind"></ul>
      </div>
    </div>

    <div class="relative w-full px-6 py-5 lg:pb-10">
      <div class="mx-auto flex max-w-5xl flex-col items-center gap-4 md:gap-8">
        <div class="flex flex-wrap items-center justify-center gap-x-10 gap-y-4 opacity-80" aria-label="Programas aliados">
          <img src="assets/logos/one.png" alt="One" class="logo-invert h-8 lg:h-10 w-auto object-contain" loading="eager">
          <img src="assets/logos/alura-latam.png" alt="Alura Latam" class="logo-invert h-8 lg:h-10 w-auto object-contain" loading="eager">
          <img src="assets/logos/nocountry.png" alt="No Country" class="logo-invert h-8 lg:h-10 w-auto object-contain" loading="eager">
          <img src="assets/logos/oracle.png" alt="Oracle" class="logo-invert h-8 lg:h-10 w-auto object-contain" loading="eager">
        </div>
        <p class="text-[12px] text-muted">GENERACION 9 - TEAM 04</p>
      </div>
    </div>
  </div>

  <!-- ============ SPA SHELL ============ -->
  <div id="app" class="min-h-screen">

    <!-- Sidebar estrecho (iconos) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 hidden w-16 flex-col items-center border-r border-ash bg-void py-4 md:flex" aria-label="Navegación principal">
      <a href="#/" class="brand-icon mb-6" aria-label="TechMind — inicio">
        <img src="assets/logos/techmind-icon.png" alt="" class="logo-invert">
      </a>
      <nav id="nav-desktop" class="flex flex-1 flex-col items-center gap-2"></nav>
      <div class="mt-4 flex flex-col items-center gap-2">
        <button type="button" data-splash-label class="splash-toggle grid h-9 w-9 place-items-center rounded-[8px] text-muted transition-colors duration-200 hover:text-volt" aria-label="Mostrar presentación" title="Mostrar presentación">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4a9 9 0 0 0-9 9 9 9 0 0 0 9 9 9 9 0 0 0 9-9 9 9 0 0 0-9-9Z"/>
            <path d="M12 8v5l3.5 2"/>
          </svg>
        </button>
        <button type="button" id="btn-lang-desktop" class="lang-toggle grid h-9 w-9 place-items-center rounded-[8px] text-[11px] font-semibold text-muted transition-colors duration-200 hover:text-volt" aria-label="Cambiar idioma">ES</button>
      </div>
    </aside>

    <!-- Cuerpo -->
    <div class="md:pl-16">
      <!-- Header plano -->
      <header class="sticky top-0 z-30 flex h-14 items-center justify-between border-b border-ash bg-void/95 px-4 backdrop-blur-sm md:px-6">
        <div class="flex items-center gap-3">
          <!-- Hamburguesa (mobile) -->
          <button type="button" id="btn-menu" class="grid h-9 w-9 place-items-center rounded-[8px] text-muted hover:text-volt transition-colors duration-200 md:hidden" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-drawer">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <a href="#/" class="hidden" aria-label="TechMind — inicio">
            <img src="assets/logos/techmind.png" alt="TechMind" class="logo-invert h-8 w-auto object-contain">
          </a>
        </div>

        <time id="header-date" class="hidden text-[12px] font-medium text-muted sm:block"></time>

        <div class="flex items-center gap-2">
          <button type="button" data-pres-label class="grid h-9 w-9 place-items-center rounded-[8px] text-muted hover:text-volt transition-colors duration-200" aria-label="Mostrar presentación" title="Mostrar presentación (P)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 18v3"/>
            </svg>
          </button>
          <button type="button" data-splash-label class="splash-toggle grid h-9 w-9 place-items-center rounded-[8px] text-muted hover:text-volt transition-colors duration-200" aria-label="Mostrar presentación" title="Mostrar presentación">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4a9 9 0 0 0-9 9 9 9 0 0 0 9 9 9 9 0 0 0 9-9 9 9 0 0 0-9-9Z"/>
              <path d="M12 8v5l3.5 2"/>
            </svg>
          </button>
          <button type="button" id="btn-lang" class="lang-toggle rounded-[8px] border border-ash px-2.5 py-1.5 text-[11px] font-semibold text-muted hover:text-volt hover:border-ash transition-colors duration-200" aria-label="Cambiar idioma">ES</button>
          <button type="button" id="btn-theme" class="grid h-9 w-9 place-items-center rounded-[8px] text-muted hover:text-volt transition-colors duration-200" aria-label="Cambiar tema">
            <!-- Icono sol (dark -> light) / luna (light -> dark); lo gestiona theme.js -->
            <svg id="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg id="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Drawer mobile -->
      <div id="mobile-drawer" class="fixed inset-0 z-40 hidden" aria-hidden="true">
        <div id="drawer-backdrop" class="absolute inset-0 bg-black/60"></div>
        <nav id="nav-mobile" class="absolute inset-y-0 left-0 flex w-60 flex-col gap-1 border-r border-ash bg-void p-4 pt-6"></nav>
      </div>

      <!-- Vista actual -->
      <main id="view" class="mx-auto max-w-7xl px-4 py-4 md:px-6"></main>
    </div>
  </div>

  <!-- Chart.js local (precargado por la splash) -->
  <script src="vendor/chart.umd.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/orb.js"></script>
  <script src="js/clasificar.js"></script>
  <script src="js/buscar.js"></script>
  <script src="js/metricas.js"></script>
  <script src="js/contenidos.js"></script>
  <script src="js/correcciones.js"></script>
  <script src="js/modelo.js"></script>
  <script src="js/faq.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/presentacion.js"></script>
</body>
</html>
