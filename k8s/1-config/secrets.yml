# Secret para credenciales sensibles
# IMPORTANTE: Estos valores deben estar codificados en base64
# Para codificar: echo -n "valor" | base64
apiVersion: v1
kind: Secret
metadata:
  name: techknowledge-secrets
  namespace: default
type: Opaque
data:
  # Oracle Database Credentials
  # COORDINAR CON EQUIPO PARA OBTENER VALORES REALES
  TK_ORACLE_USER: ""  # CODIFICAR EN BASE64: echo -n "tu_usuario" | base64
  TK_ORACLE_PASSWORD: ""  # CODIFICAR EN BASE64: echo -n "tu_password" | base64
  TK_ORACLE_DSN: ""  # CODIFICAR EN BASE64: echo -n "tu_dsn" | base64
  TK_ORACLE_WALLET_DIR: ""  # CODIFICAR EN BASE64: echo -n "ruta_wallet" | base64
  TK_ORACLE_WALLET_PASSWORD: ""  # CODIFICAR EN BASE64: echo -n "wallet_password" | base64

  # OCI Object Storage (Configuración específica OCI nativo - opcional)
  TK_OCI_CONFIG_PATH: ""  # CODIFICAR EN BASE64: echo -n "ruta_config" | base64

  # Token administrador para endpoints de gestión
  TK_ADMIN_TOKEN: ""  # CODIFICAR EN BASE64: echo -n "tu_token_admin" | base64

